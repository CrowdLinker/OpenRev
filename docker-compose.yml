# OpenRev with SQLite (simplest). Start with: docker compose up -d
services:
  openrev:
    image: ghcr.io/crowdlinker/openrev:latest
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      OPENREV_SECRET: ${OPENREV_SECRET:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPENREV_EMAIL_FROM: ${OPENREV_EMAIL_FROM:-}
    volumes:
      - openrev-data:/data

volumes:
  openrev-data:
