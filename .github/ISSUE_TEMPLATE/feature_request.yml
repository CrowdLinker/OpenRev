name: Feature request
description: Suggest something OpenRev should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or question you have today, before any solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: How you'd like OpenRev to handle it.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, or how another tool handles it.
