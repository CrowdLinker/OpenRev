name: Publish create-openrev to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# npm trusted publishing: npm trusts this workflow (set on npmjs.com → create-openrev → Settings), so no token is
# stored anywhere. The run stages the release; a maintainer approves it with 2FA on npmjs.com (create-openrev →
# Staged Packages) before it goes public. Bump the version in packages/create-openrev/package.json before each run.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.15 or newer (staged publishing)
        run: npm install -g npm@^11.15.0
      - name: Stage the release
        working-directory: packages/create-openrev
        run: npm stage publish
