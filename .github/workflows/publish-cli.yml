name: Publish create-openrev to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# npm trusted publishing: npm trusts this workflow (set on npmjs.com → create-openrev → Settings), so no token is
# stored anywhere. The version in packages/create-openrev/package.json must be bumped before each run.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 (trusted publishing needs 11.5.1 or newer)
        run: npm install -g npm@11
      - name: Publish
        working-directory: packages/create-openrev
        run: npm publish --provenance --access public
