name: Publish an npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Folder in packages/ to publish (react-native is openrev-react-native)
        type: choice
        options: [create-openrev, openrev, react-native]
        default: create-openrev

# Manual only: OpenRev's own release tags (v0.1.0, ...) must not try to republish the packages.
# npm trusted publishing: npm trusts this workflow (set on npmjs.com → <package> → Settings), so no token is stored
# anywhere. The run stages the release; a maintainer approves it with 2FA on npmjs.com (<package> → Staged Packages)
# before it goes public. Bump the version in packages/<package>/package.json before each run.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.21.1 (staged publishing needs 11.15 or newer)
        run: npm install -g npm@11.21.1
      - name: Stage the release
        working-directory: packages/${{ inputs.package }}
        run: npm stage publish
